# Waktu simulasi: Gazebo -> ROS 2
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Keadaan joint: Gazebo -> ROS 2
- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/empty/model/robin/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Perintah kecepatan roda kiri: ROS 2 -> Gazebo
- ros_topic_name: "/left_wheel/command"
  gz_topic_name: "/left_wheel/command"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# Perintah kecepatan roda kanan: ROS 2 -> Gazebo
- ros_topic_name: "/right_wheel/command"
  gz_topic_name: "/right_wheel/command"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ